<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>RP Workout</title>

    <!-- Add to Home Screen / PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#121110" />

    <!-- iOS-specific: makes "Add to Home Screen" open full-screen with no
         Safari chrome, and sets the home screen icon + status bar style. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RP Workout" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        /* Base surfaces — warm iron-black rather than a generic tech near-black */
        --bg: #121110;
        --surface: #1c1a18;
        --border: #2a2724;
        --border-strong: #3a3530;
        --input-bg: #171512;

        /* Text — warm chalk-white rather than clinical pure white */
        --text: #ece7de;
        --text-muted: #a39d95;
        --text-faint: #6b665f;

        /* Brand accent: blue, gold, and a hint of green — pulled from
           real competition bumper-plate colors (see PlateCalculator.jsx),
           so the app's identity comes from the sport itself rather than
           an arbitrary palette choice. */
        --accent-blue: #3a66c4;   /* primary action / selected state — the 45·25kg plate */
        --on-accent: #f4f0e6;     /* text placed on top of --accent-blue */

        --accent-gold: #d9a63e;   /* highlights, callouts, achievements — the 25·15kg plate */
        --accent-gold-bg: #2a2210;
        --accent-gold-border: #5a4a2a;

        --accent-green: #5fa050;  /* used sparingly — positive/on-track states — the 10kg plate */
        --accent-green-bg: #16211a;
        --accent-green-border: #345c34;

        --danger: #c6584a;        /* errors and over-limit warnings — functional, not brand */
        --danger-bg: #241616;
        --danger-border: #5a3a3a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: var(--bg); font-family: 'Sora', system-ui, sans-serif; }
      /* Respect the iPhone notch / Dynamic Island / home indicator so
         content never sits underneath them. */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      input[type=number]::-webkit-inner-spin-button,
      input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
